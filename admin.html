<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SkillVault Admin</title>

<link rel="stylesheet" href="style.css">

<style>
.admin{
  max-width:1100px;
  margin:40px auto;
  padding:0 4%;
}

.box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px;
  margin:18px 0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid .full{
  grid-column:1/-1;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:9px;
}

textarea{
  min-height:100px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:.8rem;
}

.hidden{
  display:none;
}

.msg{
  padding:10px;
  border-radius:8px;
  background:#eef7f6;
  margin:10px 0;
}

.opp-admin{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.danger{
  background:#a22;
  color:#fff;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  .grid .full{
    grid-column:auto;
  }

  .table{
    display:block;
    overflow:auto;
  }
}
</style>
</head>

<body>

<header>
  <nav class="nav">
    <a class="brand" href="index.html">
      <b>S</b>
      <span>Skill<span>Vault</span></span>
    </a>

    <a class="nav-btn" href="index.html">View Site</a>
  </nav>
</header>

<main class="admin">

  <!-- LOGIN -->
  <section id="loginBox" class="box">

    <p class="kicker">ADMIN ACCESS</p>

    <h1>SkillVault Admin</h1>

    <p>Sign in with the administrator account.</p>

    <form id="login">

      <div class="grid">

        <input
          id="email"
          type="email"
          placeholder="Admin email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          required
        >

      </div>

      <button class="btn primary" type="submit">
        Sign in
      </button>

      <div id="loginMsg"></div>

    </form>

  </section>


  <!-- DASHBOARD -->
  <section id="dashboard" class="hidden">

    <div class="box">

      <div class="opp-admin">

        <div>
          <p class="kicker">DASHBOARD</p>
          <h2>Manage SkillVault</h2>
        </div>

        <button id="logout" class="btn light">
          Log out
        </button>

      </div>

      <div id="msg" class="msg"></div>

    </div>


    <!-- ADD OPPORTUNITY -->
    <div class="box">

      <h2>Add opportunity</h2>

      <form id="oppForm">

        <div class="grid">

          <input
            id="title"
            placeholder="Opportunity title"
            required
          >

          <input
            id="org"
            placeholder="Organization"
            required
          >

          <select id="category" required>
            <option value="">Category</option>
            <option value="scholarship">Scholarship</option>
            <option value="trainee">Graduate Trainee</option>
            <option value="internship">Internship</option>
            <option value="job">Job</option>
          </select>

          <select id="location" required>
            <option value="">Location</option>
            <option value="nigeria">Nigeria</option>
            <option value="international">International</option>
            <option value="remote">Remote</option>
          </select>

          <input
            id="deadline"
            type="date"
          >

          <input
            id="url"
            type="url"
            placeholder="Application URL"
            required
          >

          <textarea
            id="description"
            class="full"
            placeholder="Description"
            required
          ></textarea>

        </div>

        <button class="btn primary" type="submit">
          Publish opportunity
        </button>

      </form>

    </div>


    <!-- CURRENT OPPORTUNITIES -->
    <div class="box">

      <h2>Current opportunities</h2>

      <div id="opps">
        Loading...
      </div>

    </div>


    <!-- SUBSCRIBERS -->
    <div class="box">

      <h2>Subscribers</h2>

      <div id="subs">
        Loading...
      </div>

    </div>


    <!-- MESSAGES -->
    <div class="box">

      <h2>Messages</h2>

      <div id="messages">
        Loading...
      </div>

    </div>

  </section>

</main>


<script src="./config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

let sb = null;
let session = null;


const $ = (id) => document.getElementById(id);


function configured() {

  return (
    typeof window.SKILLVAULT_SUPABASE_URL === "string" &&
    window.SKILLVAULT_SUPABASE_URL.startsWith("https://") &&
    typeof window.SKILLVAULT_SUPABASE_KEY === "string" &&
    window.SKILLVAULT_SUPABASE_KEY.length > 20
  );

}


async function init() {

  try {

    if (!configured()) {

      $("loginMsg").textContent =
        "Supabase configuration is missing. Please check config.js.";

      return;

    }


    if (!window.supabase) {

      $("loginMsg").textContent =
        "Supabase library failed to load. Please refresh the page.";

      return;

    }


    sb = window.supabase.createClient(
      window.SKILLVAULT_SUPABASE_URL,
      window.SKILLVAULT_SUPABASE_KEY
    );


    const { data, error } =
      await sb.auth.getSession();


    if (error) {

      console.error("Session error:", error);

      $("loginMsg").textContent =
        error.message;

      return;

    }


    if (data && data.session) {

      await enter(data.session);

    }

  } catch (err) {

    console.error("Initialization error:", err);

    $("loginMsg").textContent =
      "Unable to initialize admin login. Check the browser console.";

  }

}


async function enter(s) {

  session = s;

  $("loginBox").classList.add("hidden");

  $("dashboard").classList.remove("hidden");


  await Promise.all([
    loadOpps(),
    loadSubs(),
    loadMessages()
  ]);

}


$("login").addEventListener("submit", async (e) => {

  e.preventDefault();


  const email =
    $("email").value.trim();

  const password =
    $("password").value;


  if (!sb) {

    $("loginMsg").textContent =
      "Supabase is not initialized. Please refresh the page.";

    return;

  }


  $("loginMsg").textContent =
    "Signing in...";


  try {

    const { data, error } =
      await sb.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      console.error("Login error:", error);

      $("loginMsg").textContent =
        error.message;

      return;

    }


    if (!data.session) {

      $("loginMsg").textContent =
        "Login succeeded, but no session was returned.";

      return;

    }


    await enter(data.session);


  } catch (err) {

    console.error("Unexpected login error:", err);

    $("loginMsg").textContent =
      "Something went wrong while signing in.";

  }

});


$("logout").addEventListener("click", async () => {

  if (sb) {

    await sb.auth.signOut();

  }

  location.reload();

});


$("oppForm").addEventListener("submit", async (e) => {

  e.preventDefault();


  const row = {

    title: $("title").value.trim(),

    organization: $("org").value.trim(),

    category: $("category").value,

    location: $("location").value,

    deadline: $("deadline").value || null,

    application_url: $("url").value.trim(),

    description: $("description").value.trim()

  };


  const { error } =
    await sb
      .from("opportunities")
      .insert(row);


  $("msg").textContent =
    error
      ? error.message
      : "Opportunity published successfully.";


  if (!error) {

    e.target.reset();

    await loadOpps();

  }

});


async function loadOpps() {
async function loadOpps() {

  const { data, error } =
    await sb
      .from("opportunities")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  $("opps").innerHTML =
    error

      ? error.message

      : (data || [])
          .map(x => `

            <div class="opp-admin">

              <span>
                <b>${esc(x.title || x.name || "")}</b>
                <br>
                <small>${esc(x.organization || x.org || "")}</small>
              </span>

              <div>

                <button
                  class="btn light"
                  onclick="editOpp('${esc(x.id)}')"
                >
                  Edit
                </button>

                <button
                  class="btn danger"
                  onclick="delOpp('${esc(x.id)}')"
                >
                  Delete
                </button>

              </div>

            </div>

          `)
          .join("")

        || "No opportunities yet.";

}


async function delOpp(id) {

  if (!confirm("Delete this opportunity?")) {
    return;
  }


  const { error } =
    await sb
      .from("opportunities")
      .delete()
      .eq("id", id);


  $("msg").textContent =
    error
      ? error.message
      : "Deleted.";


  await loadOpps();

}


async function loadSubs() {

  const { data, error } =
    await sb
      .from("subscribers")
      .select("*")
      .order("created_at", {
        ascending:false
      });


  $("subs").innerHTML =
    error

      ? error.message

      : (data || []).length

        ? `

          <table class="table">

            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Interest</th>
            </tr>

            ${data.map(x => `

              <tr>

                <td>${esc(x.name || "")}</td>

                <td>${esc(x.email || "")}</td>

                <td>${esc(x.interest || "")}</td>

              </tr>

            `).join("")}

          </table>

        `

        : "No subscribers yet.";

}


async function loadMessages() {

  const { data, error } =
    await sb
      .from("messages")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  $("messages").innerHTML =
    error

      ? error.message

      : (data || []).length

        ? `

          <table class="table">

            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Message</th>
              <th>Action</th>
            </tr>

            ${data.map(x => `

              <tr>

                <td>${esc(x.name || "")}</td>

                <td>${esc(x.email || "")}</td>

                <td>${esc(x.message || x.content || "")}</td>

                <td>
                  <button
                    class="btn danger"
                    onclick="deleteMessage('${x.id}')">
                    Delete
                  </button>
                </td>

              </tr>

            `).join("")}

          </table>

        `

        : "No messages yet.";

}


async function deleteMessage(id) {

  if (!confirm("Delete this message?")) return;

  const { error } =
    await sb
      .from("messages")
      .delete()
      .eq("id", id);

  $("msg").textContent =
    error
      ? error.message
      : "Message deleted successfully.";

  if (!error) {
    loadMessages();
  }
}

function esc(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, (m) => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m]));

}


init();


async function editOpp(id) {

  const { data, error } =
    await sb
      .from("opportunities")
      .select("*")
      .eq("id", id)
      .single();

  if (error) {
    $("msg").textContent = error.message;
    return;
  }

  $("title").value = data.title || "";
  $("org").value = data.organization || "";
  $("category").value = data.category || "";
  $("location").value = data.location || "";
  $("deadline").value = data.deadline || "";
  $("url").value = data.application_url || "";
  $("description").value = data.description || "";

  $("msg").textContent =
    "Opportunity loaded. Edit the details above, then publish to save the changes.";

  window.editingOpportunityId = id;

  window.scrollTo({
    top: $("oppForm").offsetTop - 30,
    behavior: "smooth"
  });
}


</script>

</body>
</html>
